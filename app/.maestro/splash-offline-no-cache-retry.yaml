appId: host.exp.Exponent
name: E2E-001 Airplane-mode launch with a session but no cached profile shows retry
---
# The session is established via a fresh magic-link token whose profile has
# never been fetched by critical-data-service, so cache:profile-snapshot is
# empty going into the offline relaunch below (kind: 'unavailable').
- launchApp:
    clearState: true
- openLink: suliv://login#access_token=${MAGIC_LINK_ACCESS_TOKEN}&refresh_token=${MAGIC_LINK_REFRESH_TOKEN}
- assertVisible: Início
- stopApp
- setAirplaneMode: true
- launchApp
- assertVisible:
    id: state-view-splash_offline
- assertVisible:
    id: state-view-primary-action
- setAirplaneMode: false
- tapOn:
    id: state-view-primary-action
- assertVisible: Início
