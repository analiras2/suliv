appId: host.exp.Exponent
name: E2E-004 Airplane-mode launch with no session
---
- launchApp:
    clearState: true
- setAirplaneMode: true
- launchApp
- assertVisible:
    id: state-view-login_offline_no_session
- assertVisible:
    id: login-magic-link-button
- assertNotVisible:
    id: state-view-splash_offline
- setAirplaneMode: false
- assertNotVisible:
    id: state-view-login_offline_no_session
