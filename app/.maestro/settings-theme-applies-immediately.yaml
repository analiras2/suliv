appId: host.exp.Exponent
name: E2E-002 Theme changes apply immediately and persist across relaunch
---
- launchApp:
    clearState: true
- openLink: suliv://login#access_token=${THEME_ACCESS_TOKEN}&refresh_token=${THEME_REFRESH_TOKEN}
- assertVisible: Início
- tapOn: Você
- tapOn:
    id: settings-theme
- tapOn:
    id: settings-theme-option-dark
- assertVisible:
    id: settings-theme-option-dark
- tapOn:
    id: settings-header-back
- stopApp
- launchApp
- tapOn: Você
- tapOn:
    id: settings-theme
- assertVisible:
    id: settings-theme-option-dark
