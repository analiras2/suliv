name: suliv-local-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suliv_test
      POSTGRES_PASSWORD: suliv_test
      POSTGRES_DB: suliv_test
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suliv_test -d suliv_test']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - suliv_postgres_test_data:/var/lib/postgresql/data

volumes:
  suliv_postgres_test_data:
